name: RelayOS (MD / MF)

on:
  workflow_dispatch:
    inputs:
      device:
        description: Nokia UBI device to build
        type: choice
        required: true
        default: md
        options:
          - md
          - mf
      mode:
        description: Validate configuration only, or build and publish firmware
        type: choice
        required: true
        default: firmware
        options:
          - validate
          - firmware

permissions:
  contents: read

concurrency:
  group: relayos-build-${{ inputs.device }}
  cancel-in-progress: false

env:
  DEVICE: ${{ inputs.device }}
  SUBTARGET: ${{ inputs.device == 'md' && 'an7581' || 'an7583' }}

jobs:
  firmware:
    name: RelayOS ${{ inputs.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      artifact_id: ${{ steps.firmware_artifact.outputs.artifact-id }}
    steps:
      - name: Check out private RelayOS product source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Ensure sufficient disk space on hosted runner
        if: inputs.mode == 'firmware'
        run: scripts/runner-preflight.sh

      - name: Install build and verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bison ccache clang file flex gawk gettext git \
            libelf-dev libncurses-dev libssl-dev python3 python3-pyelftools \
            python3-setuptools rsync subversion swig time unzip wget \
            xz-utils zlib1g-dev zstd device-tree-compiler u-boot-tools
          df -h .

      - name: Test official-only source policy (offline)
        run: bash tests/test-upstream-source.sh

      - name: Prepare locked OpenWrt and product feed
        run: scripts/prepare.sh "$DEVICE"

      - name: Verify native single-profile configuration and kernel fragment
        run: scripts/configure.sh "$DEVICE"

      - name: Run console regression tests
        run: scripts/test-console.sh "$DEVICE"

      - name: Restore source download cache
        id: source_cache
        if: inputs.mode == 'firmware'
        uses: actions/cache/restore@v5
        with:
          path: work/${{ inputs.device }}/openwrt/dl
          key: relayos-downloads-${{ inputs.device }}-${{ hashFiles('upstream.lock', 'feeds.conf', 'configs/**/*.config') }}
          restore-keys: |
            relayos-downloads-${{ inputs.device }}-

      - name: Download locked source archives
        if: inputs.mode == 'firmware'
        run: scripts/build.sh "$DEVICE" download

      # Preserve downloaded sources before a lengthy compilation. A later
      # runner failure should not force downloading all source archives again.
      - name: Save source download cache
        if: inputs.mode == 'firmware' && steps.source_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: work/${{ inputs.device }}/openwrt/dl
          key: ${{ steps.source_cache.outputs.cache-primary-key }}

      - name: Compile selected firmware
        if: inputs.mode == 'firmware'
        run: scripts/build.sh "$DEVICE" compile

      - name: Verify and collect selected firmware
        if: inputs.mode == 'firmware'
        run: scripts/build.sh "$DEVICE" verify

      - name: Preserve diagnostics if validation or build fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relayos-debug-${{ inputs.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
          path: |
            work/${{ inputs.device }}/build-logs/*.log
            work/${{ inputs.device }}/openwrt/.config
            work/${{ inputs.device }}/openwrt/tmp/relayos-kernel-merged.config
            work/${{ inputs.device }}/openwrt/build_dir/target-*/linux-airoha_${{ env.SUBTARGET }}/linux-*/.config
            work/${{ inputs.device }}/openwrt/bin/targets/airoha/${{ env.SUBTARGET }}/*.manifest

      - name: Upload verified firmware and provenance
        id: firmware_artifact
        if: inputs.mode == 'firmware'
        uses: actions/upload-artifact@v7
        with:
          name: relayos-build-${{ inputs.device }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/${{ inputs.device }}/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish verified RelayOS ${{ inputs.device }} prerelease
    if: inputs.mode == 'firmware'
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download selected device output
        uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.firmware.outputs.artifact_id }}
          path: release-input
          merge-multiple: true

      - name: Confirm complete and consistent release set
        shell: bash
        run: |
          set -euo pipefail
          cd release-input
          prefix="relayos-airoha-$SUBTARGET-nokia_xg-040g-$DEVICE-ubi"
          test -s "$prefix-squashfs-sysupgrade.itb"
          test -s "$prefix-initramfs-recovery.itb"
          for suffix in manifest config.buildinfo kernel.config feeds.buildinfo source.buildinfo; do
            test -s "relayos-$DEVICE.$suffix"
          done
          grep -Fx "product_commit=$GITHUB_SHA" "relayos-$DEVICE.source.buildinfo"
          grep -Fx "openwrt_source=https://github.com/openwrt/openwrt.git" "relayos-$DEVICE.source.buildinfo"
          grep -Fx "device=$DEVICE" "relayos-$DEVICE.source.buildinfo"
          grep -Fx "board=nokia,xg-040g-$DEVICE-ubi" "relayos-$DEVICE.source.buildinfo"
          sha256sum -c "RELAYOS-$DEVICE-SHA256SUMS"
          # Never include the other model or unrelated artifacts in a release.
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8

      - name: Create immutable development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="relayos-dev-$DEVICE-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          upstream="$(sed -n 's/^openwrt_commit=//p' "release-input/relayos-$DEVICE.source.buildinfo")"
          gh release create "$tag" release-input/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "RelayOS ${{ inputs.device }} (${{ env.SUBTARGET }}) #${{ github.run_number }}" \
            --notes "Nokia XG-040G-$DEVICE ($SUBTARGET), UBI boot layout ONLY. Kernel WireGuard, copper Ethernet, no PON. Source: $GITHUB_SHA; OpenWrt: https://github.com/openwrt/openwrt/commit/$upstream. Hardware acceptance is separate from build verification." \
            --prerelease
