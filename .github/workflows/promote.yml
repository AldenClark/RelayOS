name: Promote RelayOS firmware

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Verified development prerelease tag to promote
        type: string
        required: true

permissions:
  contents: write

concurrency:
  group: relayos-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify and promote unchanged firmware
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEV_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$DEV_TAG" =~ ^relayos-([0-9]{8}-[0-9a-f]{12})-(md|mf)-dev\.([0-9]+\.[0-9]+)$ ]]
          version="${BASH_REMATCH[1]}"
          device="${BASH_REMATCH[2]}"
          build_id="${BASH_REMATCH[3]}"
          stable_tag="relayos-$version-$device"
          test "$(gh release view "$DEV_TAG" --json isDraft,isPrerelease --jq '.isPrerelease and (.isDraft | not)')" = true
          commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$DEV_TAG" --jq 'select(.object.type == "commit") | .object.sha')"
          mkdir release-input
          gh release download "$DEV_TAG" --dir release-input
          scripts/check-release.sh release-input "$device" "$version" "$commit" "$build_id"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$stable_tag" --jq "[.[] | select(.ref == \"refs/tags/$stable_tag\")] | length")" = 0
          gh release create "$stable_tag" release-input/* \
            --target "$commit" \
            --title "RelayOS $version ($device)" \
            --notes "Promoted from $DEV_TAG without rebuilding. Nokia XG-040G-$device UBI layout only. Source: $commit. Build: $build_id."
